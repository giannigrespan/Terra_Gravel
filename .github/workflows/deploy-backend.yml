# GitHub Actions Workflow - Deploy Backend to Vercel
# Triggers on push to main branch or manual dispatch

name: 🚀 Deploy Backend to Vercel

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch: # Allow manual trigger

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      # 3. Install dependencies
      - name: 📦 Install dependencies
        working-directory: ./backend
        run: npm ci

      # 4. Run linting (optional but recommended)
      - name: 🔍 Lint code
        working-directory: ./backend
        run: npm run lint || echo "No lint script found, skipping"
        continue-on-error: true

      # 5. Run tests (if you have them)
      - name: 🧪 Run tests
        working-directory: ./backend
        run: npm test || echo "No tests found, skipping"
        continue-on-error: true
        env:
          NODE_ENV: test

      # 6. Deploy to Vercel
      - name: 🚀 Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./backend
          vercel-args: '--prod'

      # 7. Notify on success
      - name: ✅ Deployment Success
        if: success()
        run: |
          echo "🎉 Backend deployed successfully to Vercel!"
          echo "🔗 Check your deployment at: https://vercel.com/dashboard"

      # 8. Notify on failure
      - name: ❌ Deployment Failed
        if: failure()
        run: |
          echo "💥 Deployment failed! Check the logs above for details."
          exit 1
